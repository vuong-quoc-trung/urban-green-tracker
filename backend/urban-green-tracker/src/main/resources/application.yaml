spring:
  application:
    name: urban-green-tracker

  # Cấu hình kết nối PostgreSQL + PostGIS
  datasource:
    url: jdbc:postgresql://localhost:5432/urban_green_tracker
    username: postgres
    password: 7777
    driver-class-name: org.postgresql.Driver

  # Cấu hình Hibernate (Giữ nguyên không tự động sinh bảng)
  jpa:
    hibernate:
      ddl-auto: none 
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Cấu hình kết nối Redis Cache
  data:
    redis:
      host: localhost
      port: 15673
  

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-expiration: 900