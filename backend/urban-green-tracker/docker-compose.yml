name: urban-green-tracker
version: '3.8'

services:
  urban_green_db:
    image: postgis/postgis
    container_name: urban_green_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=7777
      - POSTGRES_DB=urban_green_tracker
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  urban_green_redis:
    image: redis:alpine
    container_name: urban_green_redis
    ports:
      - "15673:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  db_data:
  redis_data: